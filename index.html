<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Emberdeep</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Emberdeep">
<meta name="theme-color" content="#08090e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root{
  /* Layout: a full-bleed torch-lit canvas; HUD pinned to the corners; every menu is a chamfered iron plate laid over the world. */
  --ink:#08090e; --iron:#151822; --iron-2:#1d2130; --iron-3:#2a2f42; --edge:#454c68;
  --bone:#ece4d2; --ash:#9a9db2;
  --ember:#ff8a3d; --ember-hot:#ffc27a;
  --blood:#e0463f; --mana:#4f8fff; --gold:#f2c75c; --verd:#58d6c8; --good:#6fd08c; --bad:#ff6b5e;
  --display:"Copperplate","Copperplate Gothic Light","Trajan Pro","Palatino Linotype","Book Antiqua",Georgia,serif;
  --body:"Avenir Next","Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif;
  --cond:"Avenir Next Condensed","Roboto Condensed","Arial Narrow","Avenir Next","Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--bone);font:14px/1.4 var(--body);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--ember-hot);outline-offset:2px}
button:disabled{cursor:default}
h1,h2,h3,p,ul{margin:0;padding:0}
ul{list-style:none}
[hidden]{display:none!important}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none}
#game{position:fixed;inset:0;overflow:hidden;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* --- the chamfered plate: one shape language for every surface --- */
.plate{--k:10px;--fill:var(--iron);--e:var(--edge);--kk:calc(var(--k)*0.7071 + 1.2px);
  clip-path:polygon(var(--k) 0,calc(100% - var(--k)) 0,100% var(--k),100% calc(100% - var(--k)),calc(100% - var(--k)) 100%,var(--k) 100%,0 calc(100% - var(--k)),0 var(--k));
  background:linear-gradient(135deg,var(--e) var(--kk),transparent 0),linear-gradient(225deg,var(--e) var(--kk),transparent 0),linear-gradient(315deg,var(--e) var(--kk),transparent 0),linear-gradient(45deg,var(--e) var(--kk),transparent 0),var(--fill);
  box-shadow:inset 0 0 0 1px var(--e)}
.btn{--k:6px;--fill:var(--iron-3);--e:#5b6386;--kk:calc(var(--k)*0.7071 + 1.2px);
  clip-path:polygon(var(--k) 0,calc(100% - var(--k)) 0,100% var(--k),100% calc(100% - var(--k)),calc(100% - var(--k)) 100%,var(--k) 100%,0 calc(100% - var(--k)),0 var(--k));
  background:linear-gradient(135deg,var(--e) var(--kk),transparent 0),linear-gradient(225deg,var(--e) var(--kk),transparent 0),linear-gradient(315deg,var(--e) var(--kk),transparent 0),linear-gradient(45deg,var(--e) var(--kk),transparent 0),var(--fill);
  box-shadow:inset 0 0 0 1px var(--e);
  min-height:40px;padding:8px 14px;font:600 13px/1.15 var(--cond);letter-spacing:.06em;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn:active:not(:disabled){filter:brightness(1.3)}
.btn:disabled{opacity:.38}
.btn.hot{--fill:linear-gradient(#c75a1c,#8e3a10);--e:var(--ember-hot);color:#fff3e2}
.btn.big{min-height:52px;font-size:16px;letter-spacing:.16em;padding:12px 26px}
.btn .ic{font-size:15px}
.gold{color:var(--gold)} .tok{color:var(--verd)} .good{color:var(--good)} .bad{color:var(--bad)}

/* --- HUD --- */
#hud{position:absolute;inset:0;pointer-events:none;font-family:var(--cond)}
#tl{position:absolute;left:max(8px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));display:flex;gap:6px;align-items:flex-start}
#lvl{--k:9px;--fill:#10121acc;width:38px;height:38px;display:grid;place-items:center;font:700 16px/1 var(--cond);color:var(--gold)}
#lvl small{display:block;font-size:8px;letter-spacing:.14em;color:var(--ash);margin-bottom:1px}
#bars{display:flex;flex-direction:column;gap:3px;width:min(42vw,220px)}
.bar{position:relative;height:15px;background:#0b0c12d9;box-shadow:inset 0 0 0 1px var(--edge)}
.bar>i{position:absolute;inset:1px;transform-origin:0 50%;transform:scaleX(var(--v,1));transition:transform .12s linear}
.bar>span{position:absolute;inset:0;display:grid;place-items:center;font:600 10px/1 var(--cond);font-variant-numeric:tabular-nums;letter-spacing:.04em;text-shadow:0 1px 2px #000}
.bar.hp>i{background:linear-gradient(#f0635b,#b02b28)} .bar.mp{height:11px} .bar.mp>i{background:linear-gradient(#6aa4ff,#2f62c9)}
.bar.mp>span{font-size:9px}
.bar.xp{height:4px} .bar.xp>i{background:var(--gold)}
.bar.flash{animation:flash .35s}
@keyframes flash{0%,60%{box-shadow:inset 0 0 0 1px #fff,0 0 10px #fff}100%{box-shadow:inset 0 0 0 1px var(--edge)}}
#buffs{display:flex;gap:3px;flex-wrap:wrap;min-height:16px}
#buffs span{font:600 10px/1 var(--cond);padding:3px 5px;background:#10121acc;box-shadow:inset 0 0 0 1px var(--c,var(--edge));color:var(--c,var(--bone));letter-spacing:.04em}
#tr{position:absolute;right:max(8px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));display:flex;gap:7px;align-items:flex-start}
#info{text-align:right;text-shadow:0 1px 3px #000}
#floor-n{font:700 15px/1.1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--ember-hot)}
#floor-t{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ash);margin:1px 0 4px}
#purse{display:flex;flex-direction:column;align-items:flex-end;gap:1px;font:600 13px/1.2 var(--cond);font-variant-numeric:tabular-nums}
#purse span{display:inline-flex;align-items:center;gap:4px}
#side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#mapwrap{--k:8px;--fill:#0c0d14b3;width:86px;height:86px;padding:3px}
#mini{width:100%;height:100%;display:block;image-rendering:pixelated}
#menu-btn{--k:9px;--fill:#171a26e6;--e:#5b6386;pointer-events:auto;position:relative;width:46px;height:46px;display:grid;place-items:center;font-size:24px;color:var(--bone)}
#menu-btn.has{--e:var(--gold);color:var(--gold);animation:pulse 1.1s infinite}
#menu-btn b{position:absolute;right:5px;bottom:3px;font:700 11px/1 var(--cond);color:var(--gold)}
#menu-btn u{position:absolute;left:5px;top:3px;font:600 9px/1 var(--cond);text-decoration:none;color:var(--ash)}
@keyframes pulse{50%{filter:brightness(1.5)}}
#bossbar{position:absolute;left:50%;top:max(14px,env(safe-area-inset-top));transform:translateX(-50%);width:min(46vw,460px);text-align:center}
#boss-name{font:700 13px/1.2 var(--display);letter-spacing:.16em;text-transform:uppercase;color:#ffd9c2;text-shadow:0 1px 4px #000;margin-bottom:3px}
.bar.boss{height:12px} .bar.boss>i{background:linear-gradient(#ff9d5c,#c2331f)}
#toasts{position:absolute;left:50%;top:calc(max(8px,env(safe-area-inset-top)) + 84px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;width:min(92vw,440px)}
.toast{font:600 12.5px/1.25 var(--cond);letter-spacing:.03em;padding:5px 11px;background:#0e1018e6;box-shadow:inset 0 0 0 1px var(--edge);text-align:center;animation:tin .18s;max-width:100%}
.toast.out{opacity:0;transition:opacity .28s}
.toast.gold{color:var(--gold);box-shadow:inset 0 0 0 1px #8a6f2d}
.toast.r0{color:#b9bcc8}.toast.r1{color:#5aa2ff}.toast.r2{color:#f2d14e}.toast.r3{color:#c57bff}.toast.r4{color:#ff8a3d;box-shadow:inset 0 0 0 1px #ff8a3d}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
#interact{pointer-events:auto;position:absolute;left:50%;bottom:92px;transform:translateX(-50%);white-space:nowrap}
#interact kbd{font:700 11px var(--cond);padding:2px 5px;background:#0006;box-shadow:inset 0 0 0 1px #fff5}
#actions{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:8px;align-items:flex-end}
.act{--k:14px;--fill:#141722e6;--e:var(--tc,#5b6386);pointer-events:auto;position:relative;width:56px;height:56px;display:grid;place-items:center;font-size:27px;color:var(--tc,var(--bone));touch-action:none}
.act .ico{display:grid;place-items:center}
.act .cd{position:absolute;inset:0;background:rgba(5,6,10,.74);transform-origin:50% 100%;transform:scaleY(var(--cd,0));pointer-events:none}
.act .key{position:absolute;left:0;right:0;bottom:2px;text-align:center;font:600 9px/1 var(--cond);color:var(--ash);letter-spacing:.05em}
.act .n{position:absolute;inset:0;display:grid;place-items:center;font:700 16px/1 var(--cond);color:#fff;text-shadow:0 1px 3px #000;pointer-events:none}
.act .q{position:absolute;right:7px;top:4px;font:700 12px/1 var(--cond);color:#fff;text-shadow:0 1px 2px #000}
.act.dry{filter:saturate(.25) brightness(.7)}
.act.empty{--e:#333850;color:#333850}
.act:active{filter:brightness(1.35)}
#a-pot{--tc:#ff8f86} #a-dash{--tc:#cfd6ea} #a-atk{display:none;--tc:var(--ember-hot);--k:22px;width:82px;height:82px;font-size:38px}
#joy{display:none;position:absolute;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;box-shadow:inset 0 0 0 2px #ffffff30;background:#ffffff0a;left:84px;top:calc(100% - 120px);opacity:.55}
#joy.on{opacity:1}
#joy i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:#ffffff38;box-shadow:inset 0 0 0 2px #ffffff66;transform:translate(var(--x,0),var(--y,0))}
body.touch #joy{display:block}
body.touch #actions{position:static;transform:none;display:block}
body.touch .act{position:absolute;width:52px;height:52px;font-size:25px;--k:13px}
body.touch .act .key{display:none}
body.touch #a-atk{display:grid;width:82px;height:82px;font-size:38px;--k:22px;right:calc(31px + env(safe-area-inset-right));bottom:calc(35px + env(safe-area-inset-bottom))}
body.touch #a-dash{right:calc(152px + env(safe-area-inset-right));bottom:calc(31px + env(safe-area-inset-bottom))}
body.touch #a-0{right:calc(147px + env(safe-area-inset-right));bottom:calc(87px + env(safe-area-inset-bottom))}
body.touch #a-1{right:calc(115px + env(safe-area-inset-right));bottom:calc(133px + env(safe-area-inset-bottom))}
body.touch #a-2{right:calc(65px + env(safe-area-inset-right));bottom:calc(156px + env(safe-area-inset-bottom))}
body.touch #a-3{right:calc(9px + env(safe-area-inset-right));bottom:calc(152px + env(safe-area-inset-bottom))}
body.touch #a-pot{left:calc(10px + env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom));width:50px;height:50px}
body.touch #interact{bottom:calc(222px + env(safe-area-inset-bottom))}
body.touch #interact kbd{display:none}
body.touch #menu-key{display:none}
#banner{position:absolute;left:0;right:0;top:24%;text-align:center;pointer-events:none;opacity:0;z-index:5}
#banner.show{animation:ban 2.6s ease-out}
#banner-a{font:700 clamp(26px,7vw,46px)/1.05 var(--display);letter-spacing:.22em;text-transform:uppercase;color:var(--ember-hot);text-shadow:0 2px 14px #000,0 0 30px #ff8a3d55;padding-left:.22em}
#banner-b{font:600 13px/1.3 var(--cond);letter-spacing:.24em;text-transform:uppercase;color:var(--bone);text-shadow:0 1px 6px #000;margin-top:6px}
#banner.boss #banner-b{color:#ffb39f;font-size:15px}
@keyframes ban{0%{opacity:0;transform:translateY(8px)}12%,70%{opacity:1;transform:none}100%{opacity:0}}

/* --- overlays --- */
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));background:rgba(6,7,12,.8);z-index:20}
.sheet{--k:14px;width:min(100%,760px);max-height:100%;display:flex;flex-direction:column;min-height:0}
.sheet-h{display:flex;align-items:center;gap:6px;padding:8px 8px 0 14px;flex:none}
.sheet-h h2{font:700 16px/1.1 var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--ember-hot);flex:1}
.x{width:44px;height:44px;display:grid;place-items:center;font-size:20px;color:var(--ash);flex:none}
.tabs{display:flex;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;touch-action:pan-x}
.tab{position:relative;padding:12px 8px 10px;font:600 12.5px/1 var(--cond);letter-spacing:.08em;display:inline-flex;align-items:center;gap:4px;text-transform:uppercase;color:var(--ash);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--ember-hot);border-color:var(--ember)}
.tab .dot{font-style:normal;min-width:15px;height:15px;padding:0 3px;border-radius:8px;background:var(--gold);color:#1a1300;font:700 10px/15px var(--cond);text-align:center}
.sheet-b{flex:1;min-height:0;overflow-y:auto;padding:12px 14px 16px;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-top:1px solid var(--edge)}
.sheet-f{flex:none;padding:10px 14px 14px;border-top:1px solid var(--edge);background:#11131c}
h3{font:700 11px/1 var(--cond);letter-spacing:.2em;text-transform:uppercase;color:var(--ash);margin:16px 0 8px}
h3:first-child{margin-top:2px}
.hint{font-size:12px;color:var(--ash);margin:6px 0 10px}

.pts{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center;margin-bottom:4px}
.pts b{grid-row:span 2;font:700 40px/1 var(--display);color:var(--gold);min-width:44px;text-align:center}
.pts span{font:600 13px/1.2 var(--cond);letter-spacing:.1em;text-transform:uppercase;align-self:end}
.pts em{font-style:normal;font-size:12px;color:var(--ash);align-self:start}
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:6px}
.mrow{display:grid;grid-template-columns:38px 1fr auto 44px;gap:9px;align-items:center;padding:7px 7px 7px 9px;background:var(--iron-2);border-left:3px solid var(--tc)}
.mi{font-size:26px;color:var(--tc)}
.mt{min-width:0;display:flex;flex-direction:column}
.mt b{font:700 14px/1.2 var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--tc)}
.mt span{font-size:12px} .mt small{font-size:11px;color:var(--ash);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv{font:700 22px/1 var(--cond);font-variant-numeric:tabular-nums;text-align:right;min-width:30px}
.mv small{display:block;font:600 9px/1.2 var(--cond);color:var(--ash);letter-spacing:.04em}
.btn.plus{min-height:44px;width:44px;padding:0;font-size:22px;--fill:var(--iron-3)}
.btn.plus:not(:disabled){--e:var(--gold);color:var(--gold)}

.bar4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slotbox{position:relative;padding:8px 4px 6px;background:var(--iron-2);border-top:2px solid var(--tc);text-align:center;font-size:26px;color:var(--tc);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:66px}
.slotbox b{position:absolute;left:5px;top:3px;font:700 10px/1 var(--cond);color:var(--ash)}
.slotbox span{font:600 10.5px/1.15 var(--cond);letter-spacing:.04em;color:var(--bone)}
.arow{display:grid;grid-template-columns:34px 1fr;gap:4px 9px;padding:9px 8px 9px 9px;background:var(--iron-2);border-left:3px solid var(--tc);margin-bottom:6px}
.ai{font-size:26px;color:var(--tc);padding-top:2px}
.at b{font:700 14px/1.2 var(--cond);letter-spacing:.06em;text-transform:uppercase}
.at i{font:600 11px var(--cond);font-style:normal;color:var(--gold);margin-left:6px;letter-spacing:.06em}
.meta{display:block;font:500 11px/1.3 var(--cond);letter-spacing:.05em;color:var(--ash);text-transform:uppercase}
.at p{font-size:12.5px;line-height:1.35;margin-top:3px} .at p b{font:700 12.5px var(--body);letter-spacing:0;text-transform:none;color:var(--ember-hot)}
.aslots{grid-column:2;display:flex;gap:5px;align-items:center;margin-top:4px}
.aslots span{font:600 10px var(--cond);letter-spacing:.1em;color:var(--ash);text-transform:uppercase;margin-right:2px}
.sb{width:40px;height:34px;background:var(--iron-3);box-shadow:inset 0 0 0 1px var(--edge);font:700 13px var(--cond);color:var(--ash)}
.sb.on{background:var(--tc);color:#0b0c12;box-shadow:none}
.locked{display:flex;flex-wrap:wrap;gap:5px}
.locked span{display:inline-flex;align-items:center;gap:5px;padding:4px 8px 4px 6px;background:var(--iron-2);font:500 11.5px var(--cond);color:var(--ash)}
.locked .ic{font-size:14px;color:var(--tc)}

.eqrow{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;max-width:420px}
.bag{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;max-width:420px}
.cell{position:relative;aspect-ratio:1;display:grid;place-items:center;background:var(--iron-2);box-shadow:inset 0 0 0 1px var(--rc,var(--edge));color:var(--rc,#4a506b);font-size:24px;min-width:0}
.cell.empty{box-shadow:inset 0 0 0 1px #2a2f42;color:#2f3449}
.cell.sel{background:var(--iron-3);box-shadow:inset 0 0 0 2px #fff}
.cell .arr{position:absolute;right:2px;top:1px;font:700 10px/1 var(--body);font-style:normal;color:var(--good)}
.cell .upn{position:absolute;left:3px;bottom:2px;font:700 9px/1 var(--cond);font-style:normal;color:var(--bone)}
.cell small{position:absolute;left:0;right:0;bottom:2px;text-align:center;font:600 8px/1 var(--cond);letter-spacing:.06em;text-transform:uppercase;color:var(--ash)}
.r0{--rc:#8a8fa6}.r1{--rc:#5aa2ff}.r2{--rc:#f2d14e}.r3{--rc:#c57bff}.r4{--rc:#ff8a3d}
.gearwrap{display:grid;gap:14px}
@media (min-width:700px){.gearwrap.two{grid-template-columns:minmax(0,420px) 1fr;align-items:start}}
.card{min-height:120px}
.card.none{display:grid;place-items:center;color:var(--ash);font-size:13px;min-height:84px}
.ch{display:grid;grid-template-columns:46px 1fr;gap:10px;align-items:center;margin-bottom:6px}
.iname{display:block;font:700 15px/1.2 var(--cond);letter-spacing:.04em;color:var(--rc)}
.lines{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:1px 12px;font-size:12.5px}
.lines li.base{color:#fff;font-weight:600}
.lines li:not(.base){color:#a9c6ff}
.legend{font-size:12.5px;color:var(--ember);margin-top:5px;font-weight:600}
.cmp{font-size:11.5px;color:var(--ash);margin-top:5px}
.cbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.cbtns .btn{flex:1 1 120px}
.row2{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:2px 18px}
.stats div{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid #262a3b;font-size:13px}
.stats div b{font:600 13px var(--cond);font-variant-numeric:tabular-nums}
.note{font-size:12.5px;line-height:1.4;padding:7px 9px;background:var(--iron-2);border-left:3px solid var(--ember);margin-bottom:5px}
.note b{color:var(--ember-hot)}
.sys{display:grid;gap:8px;max-width:420px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px;margin-top:4px}
.keys b{font:600 12px var(--cond);color:var(--ember-hot);letter-spacing:.05em;white-space:nowrap}

.npc-q{font-size:12.5px;font-style:italic;color:var(--ash);padding:0 14px 8px}
.offer{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:8px 8px 8px 10px;background:var(--iron-2);border-left:3px solid var(--tc,var(--edge));margin-bottom:6px}
.offer .oi{font-size:25px;color:var(--tc,var(--bone))}
.offer .ot{min-width:0}
.offer .ot b{display:block;font:700 13.5px/1.2 var(--cond);letter-spacing:.05em;text-transform:uppercase}
.offer .ot span{display:block;font-size:12px;line-height:1.3;color:var(--ash)}
.offer .ot span b{display:inline;font:700 12px var(--body);text-transform:none;letter-spacing:0;color:var(--ember-hot)}

  g.gain.setValueAtTime(vol || 0.04, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

function genDungeon(f) {

      for (const [px, py] of [[r.x + 2, r.y + 2], [r.x + r.w - 3, r.y + 2], [r.x + 2, r.y + r.h - 3], [r.x + r.w - 3, r.y + r.h - 3]]) m.t[py * W + px] = 0;

  const dd = (a, b) => Math.abs(rs[a].cx - rs[b].cx) + Math.abs(rs[a].cy - rs[b].cy);
  while (inT.length < rs.length) {
    let best = null, bd = 1e9;
    for (const a of inT) for (let b = 0; b < rs.length; b++) { if (inT.includes(b)) continue; const d = dd(a, b); if (d < bd) { bd = d; best = [a, b]; } }
    edges.push(best); used.add(key(best[0], best[1])); inT.push(best[1]);

    const a = irnd(0, rs.length - 1); let best = -1, bd = 1e9;
    for (let b = 0; b < rs.length; b++) { if (b === a || used.has(key(a, b))) continue; const d = dd(a, b); if (d < bd) { bd = d; best = b; } }

  for (const [a, b] of edges) {

/* ---------- sanctuary NPCs ---------- */

/* ---------- actions ---------- */
const ACTS = {
  close() { if (npcOpen) closeNpc(); else closePanel(); },
  tab(v) { panelTab = v; selItem = null; abandonArm = false; sfx('ui'); return 'top'; },
  ntab(v) { npcTab = v; selItem = null; sfx('ui'); return 'top'; },
  mast(k) { if (P.pts <= 0 || !MAST[k]) return; P.pts--; P.mp[k]++; recalc(); sfx('pick'); },
  slot(v) {
    const [id, i] = v.split(':'), s = +i, cur = P.slots.indexOf(id);
    if (cur === s) P.slots[s] = null; else { if (cur >= 0) P.slots[cur] = P.slots[s]; P.slots[s] = id; }
    sfx('ui');
  },
  sel(v) { selItem = selItem === +v ? null : +v; sfx('ui'); },
  equip() { const f = findItem(selItem); if (f && f.where === 'bag') equipItem(f.it); },
  unequip() { const f = findItem(selItem); if (f && f.where === 'eq') unequipItem(f.it.slot); },
  scrap() { const f = findItem(selItem); if (f && f.where === 'bag') { scrapItem(f.it, false); selItem = null; } },
  sell() { const f = findItem(selItem); if (f && f.where === 'bag') { scrapItem(f.it, true); selItem = null; } },
  junk(v) { const sell = v === 'sell', list = junkList(); let tot = 0; for (const it of list) { tot += scrapValue(it, sell); scrapItem(it, sell); } if (list.length) toast((sell ? 'Sold ' : 'Scrapped ') + list.length + ' items for ' + fmt(tot) + ' gold', 'gold'); selItem = null; },
  buy() {
    const f = findItem(selItem); if (!f || f.where !== 'shop') return;
    if (P.bag.length >= BAG_MAX) { toast('Backpack is full'); return; }
    if (!pay('gold', f.it.val * 5)) return;
    G.shops.items.splice(G.shops.items.indexOf(f.it), 1); P.bag.push(f.it);
  },
  potion() { if (P.pot >= P.potMax || !pay('gold', potPrice())) return; P.pot++; },
  belt() { if ((P.belt || 0) >= BELT_MAX || !pay('gold', beltPrice())) return; P.belt = (P.belt || 0) + 1; recalc(); P.pot = Math.min(P.potMax, P.pot + 1); toast('You can now carry ' + P.potMax + ' potions', 'gold'); },
  crate() {
    if (P.bag.length >= BAG_MAX || !pay('gold', cratePrice())) return;
    const it = mkItem(G.floor + 1, { min: 1, bonus: 2 }); P.bag.push(it); selItem = it.id; toast(it.name, 'r' + it.rar);
  },
  temper(s) { const it = P.eq[s]; if (!it || it.up >= 10 || !pay('gold', temperPrice(it))) return; it.up++; recalc(); toast(it.name + ' tempered to +' + it.up, 'gold'); },
  tome(i) { const t = G.shops.tomes[+i]; if (!t || t.sold || !pay('gold', tomePrice(t))) return; t.sold = true; learn(t.ab, t.ranks); },
  rest() { P.hp = P.maxHp; P.mana = P.maxMana; sfx('heal'); toast('Health and mana restored'); },
  bless(k) { if (P.bless === k || !pay('gold', blessPrice())) return; P.bless = k; recalc(); toast(BLESS[k].name + ' received', 'gold'); },
  bcache(i) { const t = G.shops.cache[+i]; if (!t || t.sold || !pay('tok', 4)) return; t.sold = true; learn(t.ab, t.ranks); },
  bemp(id) { if (!P.ab[id] || !pay('tok', tokPrice('emp', 3))) return; P.tokCost.emp = (P.tokCost.emp || 0) + 1; P.ab[id].rank++; toast(AB[id].name + ' rises to rank ' + P.ab[id].rank, 'gold'); },
  binsight() { if (!pay('tok', tokPrice('insight', 5, 2))) return; P.tokCost.insight = (P.tokCost.insight || 0) + 1; P.pts += 2; toast('+2 mastery points', 'gold'); },
  brelic(k) { const r = RELICS[k]; if ((r.max && P.relics[k] >= r.max) || !pay('tok', tokPrice(k, r.cost))) return; P.tokCost[k] = (P.tokCost[k] || 0) + 1; P.relics[k]++; recalc(); if (k === 'flask') P.pot = Math.min(P.potMax, P.pot + 1); toast(r.name + ' acquired', 'gold'); },
  bleg() { if (P.bag.length >= BAG_MAX || !pay('tok', 10)) return; const it = mkItem(G.floor + 2, { rar: 4 }); P.bag.push(it); toast(it.name + ' added to your backpack', 'r4'); sfx('rare'); },
  brespec() {

  cont() { resumeRun(); },
  resume() { closePanel(); },
  sound() { muted = !muted; try { localStorage.setItem('emberdeep.muted', muted ? '1' : '0'); } catch (e) { /* storage is optional */ } if (!muted) { initAudio(); sfx('ui'); } },

/* ---------- boons ---------- */
function rollBoons() {
  const pool = Object.keys(BOONS).filter(k => !BOONS[k].rep && !P.boons[k]), out = [], spells = P.slots.some(id => id && AB[id].mana > 0);
  while (out.length < 3 && pool.length) { const k = wpick(pool, x => (x === 'battery' && !spells) ? 0.2 : 1); out.push(k); pool.splice(pool.indexOf(k), 1); }
  for (const k of ['might', 'vit', 'lore']) if (out.length < 3) out.push(k);
  return out;
}
function offerBoons() {
  if (!G || G.mode !== 'play' || P.dead || G.boonOffer) return;
  G.boonDue = false; G.boonOffer = rollBoons(); G.paused = true; input.attack = false; input.cast.length = 0;
  $('boon-b').innerHTML = G.boonOffer.map(k => {
    const b = BOONS[k];
    return '<button class="boon plate" data-act="boon" data-v="' + k + '"><span class="bi">' + svg(b.icon) + '</span><span class="bt"><b>' + b.name + '</b><span>' + b.desc + (P.boons[k] ? ' You have ' + P.boons[k] + '.' : '') + '</span></span></button>';
  }).join('');
  $('boon').hidden = false; sfx('rare');
}

/* ---------- save and resume (kept in this browser only) ---------- */
const SAVE_KEY = 'emberdeep.save';
function saveRun() {
  if (!G || !P || P.dead || G.mode !== 'play') return;
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      v: 2, cls: P.cls, floor: G.floor, sanct: G.sanct, kills: G.kills, bossKills: G.bossKills, runTime: G.runTime, goldEarned: G.goldEarned,
      p: { level: P.level, xp: P.xp, pts: P.pts, mp: P.mp, ab: P.ab, slots: P.slots, eq: P.eq, bag: P.bag, gold: P.gold, tokens: P.tokens, relics: P.relics, bless: P.bless, tokCost: P.tokCost, belt: P.belt, boons: P.boons, pot: P.pot, hp: P.hp, mana: P.mana },
      shops: G.sanct ? G.shops : null,
    }));
  } catch (e) { /* storage is optional: without it the run just cannot be resumed */ }
}
function loadSave() {
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); return s && (s.v === 1 || s.v === 2) && CLASSES[s.cls] && s.floor >= 1 && s.p ? s : null; } catch (e) { return null; }
}
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* storage is optional */ } }
function cleanItem(it) {
  if (!it || !SLOTS.includes(it.slot) || !(it.ilvl >= 1) || !Array.isArray(it.aff) || (it.slot === 'weapon' && !WKIND[it.kind])) return null;
  it.aff = it.aff.filter(a => a && AFF[a.k] && (!AFF[a.k].typed || TYPES[a.t]) && (!AFF[a.k].mtyped || MAST[a.t])); if (!LEG[it.leg]) it.leg = null;
  it.rar = clamp(it.rar | 0, 0, 4); it.up = clamp(it.up | 0, 0, 10); it.name = String(it.name || itemName(it)); it.val = Math.max(1, it.val | 0);
  return it;
}
function resumeRun() {
  const s = loadSave(); if (!s) { renderTitle(); return; }
  initAudio(); if (AC && AC.state === 'suspended') { try { AC.resume(); } catch (e) { /* audio is optional */ } }
  G = newRunState(); newPlayer(s.cls);
  const q = s.p;
  P.level = Math.max(1, q.level | 0); P.xp = Math.max(0, +q.xp || 0); P.pts = Math.max(0, q.pts | 0);
  if (s.v === 1) { let spent = 0; for (const k in (q.mp || {})) spent += Math.max(0, q.mp[k] | 0); P.pts += Math.max(0, spent - 3); } // old school masteries: refund what was spent
  else for (const k of MAST_KEYS) P.mp[k] = Math.max(0, (q.mp && q.mp[k]) | 0);
  P.ab = {}; for (const id in (q.ab || {})) if (AB[id] && P.c.schools.includes(AB[id].type)) P.ab[id] = { rank: Math.max(1, q.ab[id].rank | 0) };
  for (const id of P.c.abilities) if (!P.ab[id]) P.ab[id] = { rank: 1 };
  P.slots = [0, 1, 2, 3].map(i => (q.slots && P.ab[q.slots[i]]) ? q.slots[i] : null);
  if (!P.slots.some(Boolean)) P.c.abilities.forEach((id, i) => { P.slots[i] = id; });
  for (const sl of SLOTS) { const it = q.eq && cleanItem(q.eq[sl]); if (it && it.slot === sl) P.eq[sl] = it; else if (sl !== 'weapon') delete P.eq[sl]; }
  P.bag = (q.bag || []).map(cleanItem).filter(Boolean).slice(0, BAG_MAX);
  P.gold = Math.max(0, +q.gold || 0); P.tokens = Math.max(0, q.tokens | 0); P.belt = clamp(q.belt | 0, 0, BELT_MAX);
  for (const k in P.relics) P.relics[k] = Math.max(0, (q.relics && q.relics[k]) | 0);
  P.tokCost = q.tokCost || {}; P.boons = {}; for (const k in (q.boons || {})) if (BOONS[k]) P.boons[k] = Math.max(1, q.boons[k] | 0);
  G.kills = s.kills | 0; G.bossKills = s.bossKills | 0; G.runTime = +s.runTime || 0; G.goldEarned = +s.goldEarned || 0;
  const shops = (s.sanct && s.shops && Array.isArray(s.shops.items)) ? { items: s.shops.items.map(cleanItem).filter(Boolean), tomes: (s.shops.tomes || []).filter(t => t && AB[t.ab] && P.c.schools.includes(AB[t.ab].type)), cache: (s.shops.cache || []).filter(t => t && AB[t.ab] && P.c.schools.includes(AB[t.ab].type)), healed: !!s.shops.healed, sel: null } : null;
  let mx = 0; const seen = it => { if (it && it.id > mx) mx = it.id; };
  SLOTS.forEach(sl => seen(P.eq[sl])); P.bag.forEach(seen); if (shops) shops.items.forEach(seen); UID = Math.max(UID, mx + 1);
  for (const k in hudC) delete hudC[k];
  $('title').hidden = true; $('death').hidden = true; $('hud').hidden = false; $('toasts').innerHTML = '';
  resize(); recalc();
  const bless = BLESS[q.bless] ? q.bless : null;
  if (s.sanct) { G.floor = s.floor; enterSanct(); if (shops) G.shops = shops; P.bless = bless; recalc(); }
  else { P.bless = bless; enterFloor(s.floor); }
  P.hp = clamp(+q.hp || P.maxHp, 1, P.maxHp); P.mana = clamp(+q.mana || 0, 0, P.maxMana); P.pot = clamp(q.pot | 0, 0, P.potMax); P.dashN = P.dashMax;
  saveRun(); toast('Run resumed at the start of ' + (s.sanct ? 'the sanctuary' : 'floor ' + s.floor), 'gold');
}

/* ---------- title and death ---------- */
function loadBest() { try { return JSON.parse(localStorage.getItem('emberdeep.best') || 'null'); } catch (e) { return null; } }
function saveBest(r) { try { localStorage.setItem('emberdeep.best', JSON.stringify(r)); } catch (e) { /* storage is optional */ } }
function renderTitle() {
  const best = loadBest(), sv = loadSave(), c = CLASSES[selClass];
  let h = '<div class="t-head"><h1>Emberdeep</h1><p>An endless descent</p></div>' +
    '<div class="t-rules"><span><b>Boss</b> every 5 floors</span><span><b>Sanctuary</b> every 10</span><span><b>One life</b> per run</span></div>' +
    (sv ? '<div class="t-cont plate"><div><b>Run in progress</b><span>Level ' + (sv.p.level | 0) + ' ' + CLASSES[sv.cls].name + ' · ' + (sv.sanct ? 'sanctuary below floor ' + sv.floor : 'start of floor ' + sv.floor) + '</span></div><button class="btn hot" data-act="cont">Continue</button></div>' : '') +
    '<div class="classes">';
  for (const k in CLASSES) {
    const x = CLASSES[k];
    h += '<button class="cls plate ' + (k === selClass ? 'on' : '') + '" style="--cc:' + x.color + '" data-act="cls" data-v="' + k + '" aria-pressed="' + (k === selClass) + '"><b>' + x.name + '</b><span class="tg">' + x.tag + '</span><span class="ics">' +
      x.abilities.map(a => '<span style="color:' + TYPES[AB[a].type].color + '">' + svg(AB[a].icon) + '</span>').join('') + '</span></button>';
  }
  h += '</div><div class="cls-d plate"><div class="cd-h" style="--cc:' + c.color + '"><b>' + c.name + '</b><span>' + c.tag + '</span></div><div class="vit"><span><b>' + c.hp + '</b> health</span><span><b>' + c.mana + '</b> mana</span><span><b>' + WKIND[c.weapon].name + '</b></span><span>Schools: <b>' + c.schools.map(k => TYPES[k].name).join(' and ') + '</b> only</span></div><p>' + c.passive + '</p>';
  for (const id of c.abilities) { const a = AB[id]; h += '<div class="cab" style="color:' + TYPES[a.type].color + '">' + svg(a.icon) + '<div style="color:var(--bone)"><b style="color:' + TYPES[a.type].color + '">' + a.name + '</b> ' + abStatic(a) + '</div></div>'; }
  h += '</div><div class="t-go">' + (sv ? '<button class="btn big" data-act="start">Begin a new descent</button><small>A new run replaces the one in progress.</small><small>' : '<button class="btn hot big" data-act="start">Begin the descent</button><small>') +
    (input.touch ? 'Left thumb moves. Hold the sword to attack. Tap an ability to cast it, or drag it to aim.' : 'WASD move · mouse aims · click attacks · 1 to 4 abilities · Space dash · Q potion · E interact · Tab menu') + '</small>' +
    (best ? '<small class="best">Deepest run: floor ' + best.floor + ' as a level ' + best.level + ' ' + esc(best.cls) + '</small>' : '') + '</div>';
  $('title-b').innerHTML = h;
}
function showTitle() {
  $('death').hidden = true; $('hud').hidden = true; $('panel').hidden = true; $('npc').hidden = true; $('boon').hidden = true; npcOpen = null;
  G = null; $('title').hidden = false; renderTitle();
}
function showDeath() {
  if (!G) return;
  const best = loadBest(), rec = { floor: G.floor, level: P.level, cls: P.c.name, kills: G.kills };
  const isBest = !best || rec.floor > best.floor || (rec.floor === best.floor && rec.level > best.level);
  if (isBest) saveBest(rec);
  const s = Math.floor(G.runTime), tm = Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
  $('death-b').innerHTML = '<h2>You have fallen</h2><p>' + P.c.name + ' · ' + tierName(G.floor) + '</p><div class="d-grid">' +
    [[G.floor, 'Floor reached'], [P.level, 'Level'], [G.kills, 'Enemies slain'], [G.bossKills, 'Bosses felled'], [fmt(G.goldEarned), 'Gold earned'], [tm, 'Time']].map(r => '<div><b>' + r[0] + '</b><span>' + r[1] + '</span></div>').join('') +
    '</div><div class="d-best">' + (isBest ? 'A new personal best.' : 'Deepest run so far: floor ' + best.floor) + '</div><button class="btn hot big" data-act="again">Descend again</button>';
  $('panel').hidden = true; $('npc').hidden = true; $('boon').hidden = true; npcOpen = null; $('death').hidden = false;
}
/* ===================== INPUT, LOOP, BOOT ===================== */
const input = { mx: 0, my: 0, wx: 0, wy: 0, sx: 0, sy: 0, attack: false, dash: false, potion: false, cast: [], touch: false, keys: {}, joy: null, atkAim: null, aimPrev: null };

function setTouch(on) {
  if (input.touch === on) return;
  input.touch = on; document.body.classList.toggle('touch', on); resize();
  if (!G) renderTitle();
}
function doInteract() {
  if (!G || G.mode !== 'play' || G.paused || P.dead) return;
  const it = G.inter; if (!it) return;
  if (it.k === 'npc') openNpc(it.id);
  else if (it.k === 'stairs') { if (G.boonDue) offerBoons(); else descend(); } // never leave a boss floor without choosing the boon
}
function playing() { return G && G.mode === 'play' && !G.paused; }

window.addEventListener('keydown', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (k === 'Tab') e.preventDefault();
  if (e.repeat) return;
  input.keys[k] = true;
  if (!G || G.mode !== 'play') { if (k === 'Enter' && !G) { if (loadSave()) ACTS.cont(); else ACTS.start(); } return; }
  if (k === 'Escape') { if (npcOpen) closeNpc(); else if (!$('panel').hidden) closePanel(); else openPanel('sys'); return; }
  if (k === 'Tab' || k === 'c' || k === 'i') { if (npcOpen) return; if (!$('panel').hidden) closePanel(); else openPanel(k === 'i' ? 'gear' : null); return; }
  if (k === 'm') { ACTS.sound(); return; }
  if (G.paused) return;
  if (k >= '1' && k <= '4') input.cast.push(+k - 1);
  else if (k === ' ') { input.dash = true; e.preventDefault(); }
  else if (k === 'q') input.potion = true;
  else if (k === 'e' || k === 'f' || k === 'Enter') doInteract();
});
window.addEventListener('keyup', e => { const k = e.key.length === 1 ? e.key.toLowerCase() : e.key; input.keys[k] = false; });
window.addEventListener('blur', () => { input.keys = {}; input.attack = false; input.atkAim = null; input.aimPrev = null; });
window.addEventListener('contextmenu', e => e.preventDefault());

const joyEl = $('joy');
function joyShow() {
  const j = input.joy;
  if (j) { joyEl.classList.add('on'); joyEl.style.left = j.ox + 'px'; joyEl.style.top = j.oy + 'px'; joyEl.style.setProperty('--x', (j.dx * 34).toFixed(1) + 'px'); joyEl.style.setProperty('--y', (j.dy * 34).toFixed(1) + 'px'); }
  else { joyEl.classList.remove('on'); joyEl.style.left = ''; joyEl.style.top = ''; joyEl.style.setProperty('--x', '0px'); joyEl.style.setProperty('--y', '0px'); }
}
cv.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse') {
    setTouch(false); input.sx = e.clientX; input.sy = e.clientY;
    if (e.button === 0) input.attack = true; else if (e.button === 2 && playing()) input.cast.push(0);
    return;
  }
  setTouch(true); e.preventDefault();
  if (!input.joy && e.clientX < VW * 0.62) {
    input.joy = { id: e.pointerId, ox: e.clientX, oy: e.clientY, dx: 0, dy: 0 };
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
    joyShow();
  }
});
cv.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse') { input.sx = e.clientX; input.sy = e.clientY; return; }
  const j = input.joy; if (!j || j.id !== e.pointerId) return;
  let dx = e.clientX - j.ox, dy = e.clientY - j.oy; const d = Math.hypot(dx, dy), R0 = 46;
  if (d > R0) { j.ox += dx / d * (d - R0); j.oy += dy / d * (d - R0); dx = dx / d * R0; dy = dy / d * R0; }
  j.dx = dx / R0; j.dy = dy / R0; joyShow();
});
function joyEnd(e) {
  if (e.pointerType === 'mouse') { if (e.button === 0 || e.type !== 'pointerup') input.attack = false; return; }
  if (input.joy && input.joy.id === e.pointerId) { input.joy = null; joyShow(); }
}
cv.addEventListener('pointerup', joyEnd); cv.addEventListener('pointercancel', joyEnd);
window.addEventListener('pointerup', e => { if (e.pointerType === 'mouse' && e.button === 0) input.attack = false; });
window.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') { input.sx = e.clientX; input.sy = e.clientY; } });

const AIM_DEAD = 16, AIM_FULL = 70; // px: drags shorter than AIM_DEAD count as a tap; AIM_FULL more reaches full range
function dragOf(st, e) { const dx = e.clientX - st.x, dy = e.clientY - st.y; return { d: Math.hypot(dx, dy), ang: Math.atan2(dy, dx) }; }
function bindBtn(id, down) { // plain press buttons: dash and potion
  const el = $(id);
  el.addEventListener('pointerdown', e => { e.preventDefault(); if (e.pointerType !== 'mouse') setTouch(true); if (playing()) down(); });
  el.addEventListener('contextmenu', e => e.preventDefault());
}
function bindAbility(i) { // tap: cast at the nearest enemy. drag: aim, then release to cast
  const el = $('a-' + i); let st = null;
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (e.pointerType === 'mouse') { if (playing()) input.cast.push(i); return; }
    setTouch(true); try { el.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
    st = { id: e.pointerId, x: e.clientX, y: e.clientY };
  });
  el.addEventListener('pointermove', e => {
    if (!st || e.pointerId !== st.id) return; const g = dragOf(st, e);
    input.aimPrev = g.d > AIM_DEAD ? { i, ang: g.ang, k: clamp((g.d - AIM_DEAD) / AIM_FULL, 0, 1) } : null;
  });
  const end = (e, cast) => {
    if (!st || e.pointerId !== st.id) return;
    const ap = input.aimPrev && input.aimPrev.i === i ? input.aimPrev : null; st = null; input.aimPrev = null;
    if (cast && playing()) input.cast.push({ i, aim: ap ? { ang: ap.ang, k: ap.k } : null });
  };
  el.addEventListener('pointerup', e => end(e, true)); el.addEventListener('pointercancel', e => end(e, false)); el.addEventListener('lostpointercapture', e => end(e, false));
  el.addEventListener('contextmenu', e => e.preventDefault());
}
function bindAttack() { // hold: attack the nearest enemy. slide while holding: aim by hand
  const el = $('a-atk'); let st = null;
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); if (e.pointerType !== 'mouse') setTouch(true);
    try { el.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
    st = { id: e.pointerId, x: e.clientX, y: e.clientY }; input.attack = true; input.atkAim = null;
  });
  el.addEventListener('pointermove', e => { if (!st || e.pointerId !== st.id) return; const g = dragOf(st, e); input.atkAim = g.d > AIM_DEAD + 4 ? { ang: g.ang } : null; });
  const end = e => { if (!st || e.pointerId !== st.id) return; st = null; input.attack = false; input.atkAim = null; };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end); el.addEventListener('lostpointercapture', end);
  el.addEventListener('contextmenu', e => e.preventDefault());
}
for (let i = 0; i < 4; i++) bindAbility(i);
bindBtn('a-dash', () => { input.dash = true; });
bindBtn('a-pot', () => { input.potion = true; });
bindAttack();
$('interact').addEventListener('click', doInteract);
$('menu-btn').addEventListener('click', () => { if (!$('panel').hidden) closePanel(); else openPanel(P && P.pts > 0 ? 'mast' : null); });

function readMove() {
  const k = input.keys; let x = 0, y = 0;
  if (input.joy) { x = input.joy.dx; y = input.joy.dy; if (Math.hypot(x, y) < 0.18) { x = 0; y = 0; } }
  else {
    if (k.a || k.ArrowLeft) x -= 1; if (k.d || k.ArrowRight) x += 1; if (k.w || k.ArrowUp) y -= 1; if (k.s || k.ArrowDown) y += 1;
  }
  input.mx = x; input.my = y;
  input.wx = cam.x + (input.sx - VW / 2) / SCALE; input.wy = cam.y + (input.sy - VH / 2) / SCALE;
}
function update(dt) {
  G.time += dt; G.runTime += dt;
  readMove();
  updPlayer(dt);
  if (G.mode !== 'play') return;
  updEnemies(dt); updProj(dt); updZones(dt); updEnemyStuff(dt); updTimers(dt); updDrops(dt); updFx(dt); cleanup();
  G.visT -= dt; if (G.visT <= 0) { G.visT = 0.07; updVis(); }
  G.flowT -= dt; if (G.flowT <= 0) { G.flowT = 0.28; updFlow(); }
  const k = 1 - Math.pow(0.0006, dt); cam.x += (P.x - cam.x) * k; cam.y += (P.y + camOffY - cam.y) * k;
}
let lastT = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  let dt = (ts - lastT) / 1000; lastT = ts; if (!(dt > 0)) return; if (dt > 0.1) dt = 0.1;
  if (G) {
    if (G.mode === 'play' && !G.paused) { let rem = dt; while (rem > 0.0005) { const s = Math.min(rem, 1 / 30); update(s); rem -= s; if (G.mode !== 'play' || G.paused) break; } }
    else if (G.mode === 'dead') { G.time += dt; updFx(dt); cleanup(); }
  }
  render(dt); updHud(dt);
}
function startRun(cls) {
  initAudio(); if (AC && AC.state === 'suspended') { try { AC.resume(); } catch (e) { /* audio is optional */ } }
  G = newRunState(); newPlayer(cls);
  for (const k in hudC) delete hudC[k];
  $('title').hidden = true; $('death').hidden = true; $('hud').hidden = false; $('toasts').innerHTML = '';
  resize(); enterFloor(1);
  toast(input.touch ? 'Find the stairs. Hold the sword to attack.' : 'Find the stairs. Click to attack, 1 to 4 for abilities.');
}
function boot() {
  try { muted = localStorage.getItem('emberdeep.muted') === '1'; lootFilter = clamp(+(localStorage.getItem('emberdeep.filter') || 0) | 0, 0, 3); } catch (e) { muted = false; }
  initStaticIcons();
  if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) { input.touch = true; document.body.classList.add('touch'); }
  resize(); renderTitle();
  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', () => {
    lastT = performance.now(); input.keys = {}; input.attack = false; input.atkAim = null; input.aimPrev = null; input.joy = null; joyShow();
    if (APP_BUILD && document.hidden && playing()) openPanel('sys'); // leaving the app mid-fight pauses it
  });

  window.addEventListener('pointerdown', () => { if (AC && AC.state !== 'running') { try { AC.resume(); } catch (e) { /* audio is optional */ } } }, { passive: true });
  if (APP_BUILD && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { /* offline support is optional */ }); });
  }
  requestAnimationFrame(t => { lastT = t; requestAnimationFrame(frame); });
}
window.EMBERDEEP = { get G() { return G; }, get P() { return P; }, input, enterFloor, enterSanct, descend, mkItem, learn, recalc, startRun, AB };
boot();
